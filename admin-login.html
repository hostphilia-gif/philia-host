<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Admin Philia Host</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=5">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { width: 100%; max-width: 380px; background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 44px; text-align: center; }
  .login-card img { height: 52px; margin: 0 auto 22px; }
  .login-card h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .login-card p.lede { font-size: 0.9rem; margin: 0 auto 28px; }
  .login-card .form-field { text-align: left; margin-bottom: 20px; }
  .login-error { color: var(--color-primary-dark); background: var(--color-primary-tint); border: 1px solid var(--color-primary); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 0.86rem; margin-bottom: 20px; }
</style>
</head>
<body>
  <div class="login-card">
    <img src="/assets/logo-transparent.png" alt="Philia Host">
    <h1>Espace Administration</h1>
    <p class="lede">Connectez-vous pour consulter les messages reçus via le site.</p>
    <div class="login-error" id="login-error" style="display:none;">Mot de passe incorrect.</div>
    <form method="POST" action="/admin/login" id="login-form">
      <div class="form-field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>
  </div>
<script>
  if (window.location.search.includes("error=1")) {
    document.getElementById("login-error").style.display = "block";
  }
</script>
</body>
</html>
